<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COREBTR Questions BANKS</title></head><body><div id="status" style="font:16px Arial;padding:20px">Loading…</div><script>const parts=["part1.txt", "part2.txt", "part3.txt", "part4.txt", "part5.txt", "part6.txt", "part7.txt", "part8.txt", "part9.txt", "part10.txt"];async function load(){try{const r=await Promise.all(parts.map(async p=>{const x=await fetch(p,{cache:'no-store'});if(!x.ok)throw new Error(p+' HTTP '+x.status);return x.text()}));document.open();document.write(r.join(''));document.close()}catch(e){document.getElementById('status').innerHTML='<b>Unable to load the question bank.</b><br><br>'+e.message+'<br><br>Check that all part files are uploaded to the same GitHub Pages folder.';console.error(e)}}load();</script></body></html>
